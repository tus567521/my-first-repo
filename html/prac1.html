<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            width: 300px;height: 300px;background-color: lightblue;
            position: relative;
        }
        .div2{
            width: 300px;height: 300px;background-color: skyblue;
            position: absolute; left: 75px; top: 75px;
        }
        .div3{
            width: 300px;height: 300px;background-color: blue;
            position: absolute; left:150px; top: 150px;
        }

    </style>
</head>
<body>
    <div class="div1">Box 1</div>
    <div class="div2">Box2</div>
    <div class="div3">Box3</div>
</body>
</html>
