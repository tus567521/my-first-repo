<!DOCTYPE html>
<html>
<head>
<title>CSS Grid</title>
<link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    box-sizing: border-box;
}

.container {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    padding: 10px;
}

.col {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.box {
    background: #66cc00;
    border: 3px solid gray;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.h1 { height: 950px; }
.h2 { height: 470px; }
.h3 { height: 310px; }
.h4 { height: 225px; }
.h5 { height: 145px; }
.h6 { height: 65px; }
</style>
<body>

<div class="container">
    <div class="col">
        <div class="box h1">1</div>
    </div>

    <div class="col">
        <div class="box h2">2</div>
        <div class="box h2">3</div>
    </div>

    <div class="col">
        <div class="box h3">4</div>
        <div class="box h3">5</div>
        <div class="box h3">6</div>
    </div>

    <div class="col">
        <div class="box h4">7</div>
        <div class="box h4">8</div>
        <div class="box h4">9</div>
        <div class="box h4">10</div>
    </div>

    <div class="col">
        <div class="box h5">11</div>
        <div class="box h5">12</div>
        <div class="box h5">13</div>
        <div class="box h5">14</div>
        <div class="box h5">15</div>
        <div class="box h5">16</div>
    </div>

    <div class="col">
        <div class="box h6">17</div>
        <div class="box h6">18</div>
        <div class="box h6">19</div>
        <div class="box h6">20</div>
        <div class="box h6">21</div>
        <div class="box h6">22</div>
        <div class="box h6">23</div>
        <div class="box h6">24</div>
        <div class="box h6">25</div>
        <div class="box h6">26</div>
        <div class="box h6">27</div>
        <div class="box h6">28</div>
    </div>
</div>

</body>
</html>
